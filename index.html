<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heli Attack 3 — Enhanced</title>
<link rel="stylesheet" href="src/fps-counter.css">
<style>
main.widescreen:not(:fullscreen){width:min(1200px,100%)}
canvas.controller-aim{cursor:none}
:root.controller-input *{cursor:none!important}
.in-collection main.widescreen:not(:fullscreen){padding:0}.in-collection main>header{display:none}

/* Keep each view's stage proportions and overlays together in browser fullscreen. */
:is(main:fullscreen,.collection-fullscreen main.widescreen){width:100vw;height:100vh;height:100dvh;max-width:none;padding:0;display:grid;grid-template-rows:minmax(0,1fr);background:#000;overflow:hidden}
:is(main:fullscreen,.collection-fullscreen main.widescreen)>:is(header,footer,#status){display:none}
:is(main:fullscreen,.collection-fullscreen main.widescreen)>#stage{place-self:center;height:min(100%,calc(100vw * 320/var(--view-width,568.888888889)));width:auto;max-width:100%;aspect-ratio:var(--view-aspect,16/9);border:0;box-shadow:none}
.collection-fullscreen{background:#000}
@font-face{font-family:FlashArial;src:url('assets/fonts/FlashArial.ttf')}
@font-face{font-family:Trade;src:url('assets/fonts/TradeGothic.ttf')}*{box-sizing:border-box}body{margin:0;background:#151a20;color:#e6e6e3;font:14px Arial,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(960px,100%);padding:20px}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}h1{font:26px Trade,Arial,sans-serif;margin:0;color:#e3e8dc}header small{color:#9ea8ae}#stage{container-type:inline-size;position:relative;background:#000;aspect-ratio:var(--view-aspect,16/9);box-shadow:0 18px 60px #0008;border:1px solid #47505a}canvas{display:block;width:100%;height:100%;cursor:crosshair;outline:none}#panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080c13a8}#panel[hidden]{display:none}.box{width:78%;max-width:480px;background:#24303bed;border:2px solid #8d9ba5;padding:28px;text-align:center;box-shadow:6px 6px #0009}h2{font:30px Trade,Arial;margin:0 0 12px;color:#dce8ec}p{line-height:1.6;color:#bbc7cc}button{font:bold 15px Arial;padding:12px 22px;color:#f1f4ed;background:#445c6e;border:1px solid #90a4b0;cursor:pointer;margin:5px}button:hover,button:focus{background:#637f8e}button:disabled{opacity:.45;cursor:wait}footer{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#9daab0;padding-top:12px}footer button{font-size:12px;padding:7px 12px}kbd{color:#e0e9eb}#controls{display:none;text-align:left;max-height:230px;overflow:auto}#controls label{display:flex;justify-content:space-between;padding:3px}#controls button{font-size:12px;padding:4px 10px}#status{font-size:12px;min-height:18px}.error{color:#ffad9b}a{color:#c4dce7}
.cheat-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;align-content:start;overflow:auto;padding:8px;background:#090f0dbb;border:1px solid #c4dcab55}.cheat-choice{font:inherit;white-space:pre-line;text-align:left;line-height:1.3;margin:0;padding:8px 10px;background:#203323e8;border:1px solid #b7d79666;color:#f0f5df}.cheat-choice:hover,.cheat-choice:focus{background:#203323e8}.cheat-choice[data-highlighted="true"]{background:#203323e8;color:white;text-shadow:0 0 .35em #fff}.cheat-choice:disabled{opacity:.55;cursor:default;background:#14231c}.cheat-status{color:#f1f5df}
.title-return,.title-return:hover:not(:disabled),.title-return:focus{position:absolute;pointer-events:auto;margin:0;padding:0;border:0;background:transparent;color:#ffffff80;font-family:Arial,sans-serif;font-weight:400;letter-spacing:-.04em;line-height:1;text-transform:lowercase}
.title-return:focus,[data-menu-highlight]:focus{outline:none}
.menu-back,.menu-back:hover,.menu-back:focus{border:0;background:transparent;color:#fff9}
.menu-back[data-highlighted="true"]{color:white}
.title-return[data-highlighted="true"],.title-return[data-highlighted="true"]:hover:not(:disabled){color:white}
</style></head><body><main class="widescreen"><header><h1>HELI ATTACK 3</h1><small>Enhanced · Collector’s Edition · Training + Zones 1-1 to 4-3 + Zone X · <a href="collection/index.html">Collection</a></small></header><div id="stage"><canvas width="896" height="640" tabindex="0" aria-label="Heli Attack 3 game"></canvas><section id="panel" hidden><div class="box"><h2 id="heading">HELI ATTACK 3</h2><p id="message">Original Training Zone and all sixteen combat stages, including Zone X.<br>Defeat the drones and survive.</p><button id="start" disabled>Start</button></div></section></div><footer><span id="input-guide"><kbd>W A S D</kbd> Move · Mouse aim / fire · <kbd>Shift</kbd> TimeDistort · <kbd>P</kbd> Pause</span><span><button id="pause">Pause</button><button id="sound">Sound on</button><button id="fullscreen" aria-pressed="false">Fullscreen</button></span></footer><p id="status"></p></main><script>function reportLoadError(message){const root=document.documentElement;if(!root.dataset.collectionLoad)root.dataset.collectionLoad='failed';document.querySelector('#panel').hidden=false;document.querySelector('#message').textContent='The game could not start: '+message;document.querySelector('#status').textContent='Refresh to retry.';}window.addEventListener('error',e=>reportLoadError(e.message||'A required file could not load.'));window.addEventListener('unhandledrejection',e=>reportLoadError(e.reason?.message||String(e.reason)));</script><script type="module" src="src/main.js"></script></body></html>
